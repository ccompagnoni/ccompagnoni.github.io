<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Chiara Compagnoni</title>
  <meta name="description" content="Photos taken by Chiara Compagnoni.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gallery — Chiara Compagnoni">
  <meta property="og:description" content="Photos taken by Chiara Compagnoni.">
  <meta property="og:url" content="https://chiaracompagnoni.com/gallery.html">
  <meta property="og:image" content="https://chiaracompagnoni.com/assets/img/share/home.jpg?v=3">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/site.css?v=20261114c">
</head>
<body data-page="gallery">
  <main id="main">
    <div class="gallery-head">
      <h1 class="headline">I really like taking pictures!</h1>
      <a href="#photos"><span class="u">Discover my favourites</span> <span class="arrow" aria-hidden="true">↓</span></a>
    </div>
    <section class="gallery" id="photos" aria-label="Photos"></section>
  </main>

  <dialog class="lightbox" aria-label="Photo viewer">
    <figure class="lightbox__figure">
      <img class="lightbox__img" alt="">
      <figcaption class="lightbox__caption">
        <span class="lightbox__meta"></span>
        <span class="lightbox__count small"></span>
      </figcaption>
    </figure>
    <button class="btn btn--icon lightbox__close" type="button" aria-label="Close">✕</button>
    <button class="btn btn--icon lightbox__prev" type="button" aria-label="Previous photo">←</button>
    <button class="btn btn--icon lightbox__next" type="button" aria-label="Next photo">→</button>
  </dialog>

  <script src="js/gallery-data.js?v=20261114c"></script>
  <script src="js/main.js?v=20261114c"></script>
</body>
</html>
